# ==================================================================================================
#  Python project configuration
# ==================================================================================================

[tool.pytest.ini_options]
pythonpath = [
  "."
]
filterwarnings = [
  "ignore::DeprecationWarning"
]

[tool.pyright]
reportGeneralTypeIssues = "none"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[[tool.mypy.overrides]]
module = [
    "config.*",
    "core.*",
    "main.*",
    "database.*",
    "schemas.*",
    "pubsub.*",
    "services.*",
    "utils.*",
    "exceptions.*",
    "tests.*",
]
ignore_missing_imports = true
