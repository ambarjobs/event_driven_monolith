# ==================================================================================================
#  Python project configuration
# ==================================================================================================

[project]
name = "event-driven-monolith"
version = "0.1.0"
description = "Event driven monolith architecture PoC."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=4.3.0",
    "cryptography>=45.0.3",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "pika>=1.3.2",
    "pydantic>=2.11.5",
    "pydantic-extra-types>=2.10.5",
    "pydantic-settings>=2.9.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.3.6",
    "types-pika-ts>=1.3.0.20250516",
    "types-python-jose>=3.5.0.20250531",
    "uvicorn>=0.34.3",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
filterwarnings = [
  "ignore::DeprecationWarning"
]

[tool.pyright]
reportGeneralTypeIssues = "none"
reportUndefinedVariable = "none"

[tool.isort]
line_length = 100
order_by_type = false
multi_line_output=3

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.format]
quote-style = "single"

[[tool.mypy.overrides]]
module = [
    "config.*",
    "core.*",
    "main.*",
    "database.*",
    "schemas.*",
    "pubsub.*",
    "services.*",
    "utils.*",
    "exceptions.*",
    "tests.*",
]
ignore_missing_imports = true
